#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "textarea"
name = "Textarea"
description.en = "Notes webapp"
description.fr = "Application web pour prendre des notes"

version = "2026.10.05~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0-only"
website = "https://textarea.my/"
demo = "https://textarea.my/"
code = "https://github.com/antonmedv/textarea"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "30M"
ram.build = "0M"
ram.runtime = "30M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/textarea"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/antonmedv/textarea/archive/8aa2247e4d92d963059e8788624e0c0d1be8d6a3.tar.gz"
    sha256 = "b9c363bd6009b66c426d0f9d401e33c1893df1e82e45ee237d448cd6e1c5e3e2"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
